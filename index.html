<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Connexion et inscription - Atlas Capital"
    >

    <title>Connexion | Atlas Capital</title>


    <!-- =========================================================
         POLICE
         ========================================================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =========================================================
         STYLE
         ========================================================= -->

    <style>

        * {
            box-sizing: border-box;
        }


        :root {

            --primary: #3b82f6;
            --primary-dark: #2563eb;

            --text: #101828;
            --secondary: #667085;

            --border: #dbe3ef;

            --background: #f7faff;

            --white: #ffffff;

            --danger: #ef4444;

            --success: #10b981;

        }


        html,
        body {

            margin: 0;
            padding: 0;

            min-height: 100%;

            font-family: Inter, Arial, sans-serif;

            color: var(--text);

            background:
                linear-gradient(
                    180deg,
                    #f8fbff 0%,
                    #f4f8ff 100%
                );

        }


        body {

            min-height: 100vh;

        }


        /* =====================================================
           HEADER
           ===================================================== */

        .auth-header {

            width: 100%;

            padding: 30px 42px;

            display: flex;

            align-items: center;

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

            text-decoration: none;

            color: #102544;

            font-size: 25px;

            font-weight: 700;

        }


        .brand svg {

            width: 30px;

            height: 30px;

        }


        /* =====================================================
           PAGE
           ===================================================== */

        .auth-page {

            width: 100%;

            min-height: calc(100vh - 90px);

            display: flex;

            justify-content: center;

            align-items: flex-start;

            padding: 45px 20px 70px;

        }


        /* =====================================================
           CARTE
           ===================================================== */

        .auth-card {

            width: 100%;

            max-width: 740px;

            background: rgba(255,255,255,0.96);

            border-radius: 26px;

            padding: 30px 42px 45px;

            box-shadow:
                0 20px 60px rgba(32, 64, 110, 0.10);

        }


        /* =====================================================
           ONGLETS
           ===================================================== */

        .auth-tabs {

            width: 100%;

            display: flex;

            padding: 5px;

            background: #eef3f9;

            border-radius: 13px;

            margin-bottom: 42px;

        }


        .auth-tab {

            flex: 1;

            border: 0;

            background: transparent;

            padding: 16px 12px;

            border-radius: 10px;

            font-family: inherit;

            font-size: 19px;

            font-weight: 600;

            color: #607087;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .auth-tab.active {

            background: #ffffff;

            color: #0f2344;

            box-shadow:
                0 3px 10px rgba(15,35,68,0.08);

        }


        /* =====================================================
           PANNEAUX
           ===================================================== */

        .auth-panel {

            display: none;

        }


        .auth-panel.active {

            display: block;

        }


        .auth-panel h2 {

            margin: 0 0 36px;

            font-size: 42px;

            line-height: 1.15;

            font-weight: 700;

            letter-spacing: -1px;

            color: #0f2344;

        }


        /* =====================================================
           FORMULAIRE
           ===================================================== */

        .form-group {

            margin-bottom: 24px;

        }


        label {

            display: block;

            margin-bottom: 10px;

            color: #102544;

            font-size: 18px;

            font-weight: 600;

        }


        .form-control {

            width: 100%;

            height: 64px;

            border: 1.5px solid #cad6e5;

            border-radius: 13px;

            background: #ffffff;

            padding: 0 18px;

            font-family: inherit;

            font-size: 17px;

            color: #172b4d;

            outline: none;

            transition: 0.2s ease;

        }


        .form-control::placeholder {

            color: #a6aeb9;

        }


        .form-control:focus {

            border-color: #6f9de8;

            box-shadow:
                0 0 0 3px rgba(59,130,246,0.08);

        }


        /* =====================================================
           TELEPHONE
           ===================================================== */

        .phone-label {

            margin-bottom: 11px;

        }


        .phone-wrapper {

            position: relative;

            width: 100%;

        }


        .phone-row {

            display: grid;

            grid-template-columns: 235px 1fr;

            gap: 10px;

            width: 100%;

        }


        /* =====================================================
           SELECTEUR PAYS
           ===================================================== */

        .country-selector {

            position: relative;

            width: 100%;

        }


        .country-button {

            width: 100%;

            height: 64px;

            border: 1.5px solid #dbe3ed;

            background: #ffffff;

            border-radius: 15px;

            padding: 0 17px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            cursor: pointer;

            font-family: inherit;

            color: #172033;

        }


        .country-button-left {

            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;

        }


        .country-flag {

            font-size: 27px;

            line-height: 1;

        }


        .country-dial {

            font-size: 20px;

            font-weight: 600;

            white-space: nowrap;

        }


        .country-arrow {

            width: 10px;

            height: 10px;

            border-right: 2px solid #7a8493;

            border-bottom: 2px solid #7a8493;

            transform: rotate(45deg);

            margin-top: -5px;

            transition: 0.2s ease;

        }


        .country-selector.open
        .country-arrow {

            transform: rotate(225deg);

            margin-top: 5px;

        }


        /* =====================================================
           LISTE DES PAYS
           ===================================================== */

        .country-menu {

            position: absolute;

            z-index: 1000;

            top: calc(100% + 9px);

            left: 0;

            /*
             * Le bouton pays (+237) n'occupe qu'une petite
             * colonne de la ligne téléphone. Avant, ce menu
             * prenait "100%" de CETTE colonne étroite, donc
             * les noms de pays et indicatifs se chevauchaient.
             * On force une largeur confortable, plafonnée à la
             * largeur de l'écran pour ne jamais déborder.
             */
            width: max(300px, 100%);

            max-width: calc(100vw - 50px);

            max-height: 390px;

            overflow-y: auto;

            background: #ffffff;

            border: 1px solid #e1e7ef;

            border-radius: 18px;

            box-shadow:
                0 18px 45px rgba(15,35,68,0.16);

            padding: 7px;

            display: none;

        }


        .country-selector.open
        .country-menu {

            display: block;

        }


        .country-search {

            width: calc(100% - 12px);

            height: 45px;

            margin: 6px;

            padding: 0 13px;

            border: 1px solid #dbe3ed;

            border-radius: 10px;

            outline: none;

            font-family: inherit;

            font-size: 14px;

        }


        .country-search:focus {

            border-color: #7ba4e9;

        }


        .country-option {

            width: 100%;

            min-height: 59px;

            border: 0;

            background: transparent;

            border-radius: 12px;

            padding: 9px 13px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            cursor: pointer;

            font-family: inherit;

            transition: 0.15s ease;

        }


        .country-option:hover {

            background: #f2f6fb;

        }


        .country-option-left {

            display: flex;

            align-items: center;

            gap: 13px;

            min-width: 0;

        }


        .country-option-flag {

            font-size: 25px;

            width: 32px;

            text-align: center;

            flex-shrink: 0;

        }


        .country-option-name {

            font-size: 16px;

            font-weight: 500;

            color: #182033;

            text-align: left;

        }


        .country-option-dial {

            color: #68758a;

            font-size: 16px;

            font-weight: 500;

            white-space: nowrap;

        }


        .country-no-result {

            padding: 20px;

            text-align: center;

            color: #7b8798;

            font-size: 14px;

        }


        /* =====================================================
           NUMERO TELEPHONE
           ===================================================== */

        .phone-input {

            background: #f0f4fa;

            border-color: #e0e7f0;

            font-size: 21px;

            letter-spacing: 0.5px;

        }


        .phone-input::placeholder {

            color: #6d788a;

            opacity: 1;

        }


        /* =====================================================
           PASSWORD
           ===================================================== */

        .password-input {

            position: relative;

        }


        .password-input .form-control {

            padding-right: 58px;

        }


        .password-toggle {

            position: absolute;

            right: 15px;

            top: 50%;

            transform: translateY(-50%);

            width: 40px;

            height: 40px;

            border: 0;

            background: transparent;

            color: #667a96;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        /* =====================================================
           EMAIL / TELEPHONE SWITCH
           ===================================================== */

        .alternative-login {

            margin-top: -9px;

            margin-bottom: 24px;

            text-align: right;

        }


        .alternative-login button {

            border: 0;

            background: transparent;

            color: #3577d4;

            font-family: inherit;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            padding: 4px 0;

        }


        .alternative-login button:hover {

            text-decoration: underline;

        }


        /* =====================================================
           ACTIONS
           ===================================================== */

        .modal-actions {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin: 4px 0 28px;

        }


        .modal-actions a {

            color: #55708f;

            text-decoration: none;

            font-size: 14px;

            font-weight: 500;

        }


        .modal-actions a:hover {

            text-decoration: underline;

        }


        .checkbox-group {

            display: flex;

            align-items: flex-start;

            gap: 10px;

            margin: 0 0 27px;

        }


        .modal-actions .checkbox-group {

            margin: 0;

        }


        .checkbox-group input {

            width: 18px;

            height: 18px;

            margin: 2px 0 0;

            accent-color: #3b82f6;

            flex-shrink: 0;

        }


        .checkbox-group label {

            margin: 0;

            font-size: 15px;

            line-height: 1.55;

            color: #66758a;

            font-weight: 400;

        }


        /* =====================================================
           BOUTON
           ===================================================== */

        .btn {

            width: 100%;

            height: 64px;

            border: 0;

            border-radius: 13px;

            font-family: inherit;

            font-size: 19px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .btn-primary {

            background: #367fe9;

            color: #ffffff;

            box-shadow:
                0 8px 18px rgba(59,130,246,0.18);

        }


        .btn-primary:hover {

            background: #286fda;

            transform: translateY(-1px);

        }


        .btn:disabled {

            opacity: 0.65;

            cursor: not-allowed;

            transform: none;

        }


        /* =====================================================
           ERREUR
           ===================================================== */

        .error-message {

            color: #ef4444;

            font-size: 13px;

            margin-top: 6px;

        }


        /* =====================================================
           TOAST
           ===================================================== */

        .toast-container {

            position: fixed;

            right: 20px;

            bottom: 20px;

            z-index: 5000;

            display: flex;

            flex-direction: column;

            gap: 10px;

            max-width: calc(100vw - 40px);

        }


        .toast {

            background: #ffffff;

            border: 1px solid #dce5ef;

            border-radius: 12px;

            padding: 14px 17px;

            min-width: 260px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.12);

            display: flex;

            align-items: center;

            gap: 10px;

            transform: translateY(20px);

            opacity: 0;

            transition: 0.25s ease;

        }


        .toast.show {

            transform: translateY(0);

            opacity: 1;

        }


        .toast-message {

            font-size: 14px;

            line-height: 1.4;

        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 700px) {

            .auth-header {

                padding: 22px 22px;

            }


            .brand {

                font-size: 22px;

            }


            .auth-page {

                padding: 20px 12px 40px;

            }


            .auth-card {

                max-width: 100%;

                border-radius: 24px;

                padding: 22px 22px 34px;

            }


            .auth-panel h2 {

                font-size: 34px;

                margin-bottom: 30px;

            }


            .phone-row {

                grid-template-columns: 43% 57%;

                gap: 7px;

            }


            .country-button {

                padding: 0 11px;

            }


            .country-button-left {

                gap: 8px;

            }


            .country-flag {

                font-size: 23px;

            }


            .country-dial {

                font-size: 17px;

            }


            .phone-input {

                font-size: 18px;

                padding-left: 14px;

                padding-right: 10px;

            }


            .auth-tab {

                font-size: 17px;

            }

        }


        @media (max-width: 420px) {

            .auth-card {

                padding-left: 17px;

                padding-right: 17px;

            }


            .phone-row {

                grid-template-columns: 42% 58%;

            }


            .country-dial {

                font-size: 16px;

            }


            .phone-input {

                font-size: 16px;

            }


            .auth-panel h2 {

                font-size: 31px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================================
         HEADER
         ========================================================= -->

    <header class="auth-header">

        <a
            href="index.html"
            class="brand"
        >

            <svg
                width="30"
                height="30"
                viewBox="0 0 24 24"
                fill="#102544"
            >

                <path d="M12 2L2 7l1 1h18l1-1-10-5z"></path>

                <path d="M4 10h2v9H4v-9zm5 0h2v9H9v-9zm5 0h2v9h-2v-9zm5 0h2v9h-2v-9z"></path>

                <path d="M2 20h20v2H2v-2z"></path>

            </svg>

            Atlas Capital

        </a>

    </header>


    <!-- =========================================================
         CONTENU
         ========================================================= -->

    <main class="auth-page">


        <div class="auth-card">


            <!-- =====================================================
                 ONGLETS
                 ===================================================== -->

            <div class="auth-tabs">

                <button
                    type="button"
                    class="auth-tab active"
                    id="tab-login"
                >
                    Connexion
                </button>


                <button
                    type="button"
                    class="auth-tab"
                    id="tab-register"
                >
                    Inscription
                </button>

            </div>



            <!-- =====================================================
                 CONNEXION
                 ===================================================== -->

            <div
                class="auth-panel active"
                id="login-panel"
            >

                <h2>
                    Content de vous revoir
                </h2>


                <form id="login-form">


                    <!-- TELEPHONE -->

                    <div
                        class="form-group"
                        id="login-phone-group"
                    >

                        <label class="phone-label">
                            Téléphone
                        </label>


                        <div class="phone-wrapper">

                            <div class="phone-row">


                                <!-- PAYS -->

                                <div
                                    class="country-selector"
                                    id="login-country-selector"
                                >

                                    <button
                                        type="button"
                                        class="country-button"
                                        id="login-country-button"
                                    >

                                        <span
                                            class="country-button-left"
                                        >

                                            <span
                                                class="country-flag"
                                                id="login-selected-flag"
                                            >
                                                🇨🇲
                                            </span>

                                            <span
                                                class="country-dial"
                                                id="login-selected-dial"
                                            >
                                                +237
                                            </span>

                                        </span>


                                        <span
                                            class="country-arrow"
                                        ></span>

                                    </button>


                                    <div
                                        class="country-menu"
                                        id="login-country-menu"
                                    >

                                        <input
                                            type="text"
                                            class="country-search"
                                            id="login-country-search"
                                            placeholder="Rechercher un pays..."
                                            autocomplete="off"
                                        >

                                        <div
                                            id="login-country-options"
                                        ></div>

                                    </div>

                                </div>


                                <!-- NUMERO -->

                                <input
                                    type="tel"
                                    id="login-phone"
                                    class="form-control phone-input"
                                    placeholder="6XX XXX XXX"
                                    inputmode="tel"
                                    autocomplete="tel"
                                    required
                                >

                            </div>

                        </div>

                    </div>


                    <!-- EMAIL -->

                    <div
                        class="form-group"
                        id="login-email-group"
                        style="display:none;"
                    >

                        <label for="login-email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="login-email"
                            class="form-control"
                            placeholder="jean.dupont@email.com"
                            autocomplete="email"
                        >

                    </div>


                    <!-- CHANGEMENT TELEPHONE / EMAIL -->

                    <div class="alternative-login">

                        <button
                            type="button"
                            id="login-method-button"
                        >
                            Utiliser une adresse email
                        </button>

                    </div>


                    <!-- MOT DE PASSE -->

                    <div class="form-group">

                        <label for="login-password">
                            Mot de passe
                        </label>


                        <div class="password-input">

                            <input
                                type="password"
                                id="login-password"
                                class="form-control"
                                placeholder="••••••••"
                                required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                data-target="login-password"
                                aria-label="Afficher ou masquer le mot de passe"
                            >

                                <svg
                                    width="22"
                                    height="22"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >

                                    <path
                                        d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                                    ></path>

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3"
                                    ></circle>

                                </svg>

                            </button>

                        </div>

                    </div>


                    <!-- OPTIONS -->

                    <div class="modal-actions">

                        <div class="checkbox-group">

                            <input
                                type="checkbox"
                                id="remember-me"
                            >

                            <label
                                for="remember-me"
                            >
                                Se souvenir de moi
                            </label>

                        </div>


                        <a href="#">
                            Mot de passe oublié ?
                        </a>

                    </div>


                    <!-- BOUTON -->

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Se connecter
                    </button>


                </form>

            </div>



            <!-- =====================================================
                 INSCRIPTION
                 ===================================================== -->

            <div
                class="auth-panel"
                id="register-panel"
            >

                <h2>
                    Créez votre compte
                </h2>


                <form id="register-form">


                    <!-- NOM -->

                    <div class="form-group">

                        <label for="reg-name">
                            Nom complet
                        </label>

                        <input
                            type="text"
                            id="reg-name"
                            class="form-control"
                            placeholder="Jean Dupont"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <!-- TELEPHONE -->

                    <div
                        class="form-group"
                        id="register-phone-group"
                    >

                        <label class="phone-label">
                            Téléphone
                        </label>


                        <div class="phone-wrapper">

                            <div class="phone-row">


                                <!-- PAYS -->

                                <div
                                    class="country-selector"
                                    id="register-country-selector"
                                >

                                    <button
                                        type="button"
                                        class="country-button"
                                        id="register-country-button"
                                    >

                                        <span
                                            class="country-button-left"
                                        >

                                            <span
                                                class="country-flag"
                                                id="register-selected-flag"
                                            >
                                                🇨🇲
                                            </span>

                                            <span
                                                class="country-dial"
                                                id="register-selected-dial"
                                            >
                                                +237
                                            </span>

                                        </span>


                                        <span
                                            class="country-arrow"
                                        ></span>

                                    </button>


                                    <div
                                        class="country-menu"
                                        id="register-country-menu"
                                    >

                                        <input
                                            type="text"
                                            class="country-search"
                                            id="register-country-search"
                                            placeholder="Rechercher un pays..."
                                            autocomplete="off"
                                        >

                                        <div
                                            id="register-country-options"
                                        ></div>

                                    </div>

                                </div>


                                <!-- NUMERO -->

                                <input
                                    type="tel"
                                    id="reg-phone"
                                    class="form-control phone-input"
                                    placeholder="6XX XXX XXX"
                                    inputmode="tel"
                                    autocomplete="tel"
                                    required
                                >

                            </div>

                        </div>

                    </div>


                    <!-- EMAIL -->

                    <div
                        class="form-group"
                        id="register-email-group"
                        style="display:none;"
                    >

                        <label for="reg-email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="reg-email"
                            class="form-control"
                            placeholder="jean.dupont@email.com"
                            autocomplete="email"
                        >

                    </div>


                    <!-- CHANGEMENT -->

                    <div class="alternative-login">

                        <button
                            type="button"
                            id="register-method-button"
                        >
                            Utiliser une adresse email
                        </button>

                    </div>


                    <!-- MOT DE PASSE -->

                    <div class="form-group">

                        <label for="reg-password">
                            Mot de passe
                        </label>


                        <div class="password-input">

                            <input
                                type="password"
                                id="reg-password"
                                class="form-control"
                                placeholder="••••••••"
                                required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                data-target="reg-password"
                                aria-label="Afficher ou masquer le mot de passe"
                            >

                                <svg
                                    width="22"
                                    height="22"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >

                                    <path
                                        d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                                    ></path>

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3"
                                    ></circle>

                                </svg>

                            </button>

                        </div>

                    </div>


                    <!-- CONFIRMATION -->

                    <div class="form-group">

                        <label for="reg-confirm">
                            Confirmer le mot de passe
                        </label>

                        <input
                            type="password"

        function validateEmail(
            email

        function normalizePhone(
            number,
            dial
        ) {

            let digits =
                String(number || '')
                    .replace(/\D/g, '');


            let countryDial =
                String(dial || '')
                    .replace(/\D/g, '');


            if (!digits)
                return '';


            /*
             * 00237690123456
             */

            if (
                digits.startsWith('00')
            ) {

                digits =
                    digits.substring(2);

            }


            /*
             * Si le numéro contient déjà
             * l'indicatif
             */

            if (
                countryDial &&
                digits.startsWith(
                    countryDial
                )
            ) {

                return '+' + digits;

            }


            /*
             * Numéro local
             * 690123456
             */

            if (
                digits.startsWith('0')
            ) {

                digits =
                    digits.substring(1);

            }


            return (
                '+' +
                countryDial +
                digits
            );

        }

                    );


                const password =
                    document.getElementById(
                        'reg-password'
                    );


                const confirm =
                    document.getElementById(
                        'reg-confirm'
                    );


                const terms =
                    document.getElementById(
                        'terms'
                    );


                const button =
                    document.querySelector(
                        '#register-form button[type="submit"]'
                    );


                clearError(name);

                clearError(password);

                clearError(confirm);



                /* NOM */

                if (
                    name.value.trim().length < 2
                ) {

                    showError(
                        name,
                        'Veuillez entrer votre nom complet.'
                    );

                    return;

                }



                /* MOT DE PASSE */

                if (
                    password.value.length < 6
                ) {

                    showError(
                        password,
                        'Le mot de passe doit contenir au moins 6 caractères.'
                    );

                    return;

                }



                /* CONFIRMATION */

                if (
                    password.value !==
                    confirm.value
                ) {

                    showError(
                        confirm,
                        'Les mots de passe ne correspondent pas.'
                    );

                    return;

                }



                /* CONDITIONS */

                if (
                    !terms.checked
                ) {

                    showToast(
                        'Vous devez accepter les conditions générales.',
                        'error'
                    );

                    return;

                }


                let signupData;


                if (
                    registerMethod === 'phone'
                ) {

                    const phone =
                        document.getElementById(
                            'reg-phone'
                        );


                    clearError(
                        phone
                    );


                    if (
                        phone.value
                            .replace(/\D/g, '')
                            .length < 6
                    ) {

                        showError(
                            phone,
                            'Veuillez entrer un numéro de téléphone valide.'
                        );

                        return;

                    }


                    const fullPhone =
                        normalizePhone(
                            phone.value,
                            registerCountry.dial
                        );


                    signupData = {

                        phone:
                            fullPhone,

                        password:
                            password.value,

                        options: {

                            data: {

                                full_name:
                                    name.value.trim(),

                                country:
                                    registerCountry.code,

                                phone_country:
                                    registerCountry.code,

                                referred_by:
                                    localStorage.getItem(
                                        'referredBy'
                                    ) || null

                            }

                        }

                    };

                }

                else {

                    const email =
                        document.getElementById(
                            'reg-email'
                        );


                    clearError(
                        email
                    );


                    if (
                        !validateEmail(
                            email.value.trim()
                        )
                    ) {

                        showError(
                            email,
                            'Veuillez entrer une adresse email valide.'
                        );

                        return;

                    }


                    signupData = {

                        email:
                            email.value.trim(),

                        password:
                            password.value,

                        options: {

                            data: {

                                full_name:
                                    name.value.trim(),

                                country:
                                    document.getElementById(
                                        'reg-country'
                                    ).value,

                                referred_by:
                                    localStorage.getItem(
                                        'referredBy'
                                    ) || null

                            }

                        }

                    };

                }


                if (
                    !window.supabaseClient
                ) {

                    showToast(
                        'Connexion au serveur impossible. Vérifiez votre connexion internet et réessayez.',
                        'error'
                    );

                    return;

                }


                const originalText =
                    button.textContent;


                button.disabled =
                    true;


                button.textContent =
                    'Création en cours...';


                try {

                    const {
                        data,
                        error
                    } =
                        await window.supabaseClient
                            .auth
                            .signUp(
                                signupData
                            );


                    if (error) {

                        showToast(
                            error.message,
                            'error'
                        );


                        button.disabled =
                            false;


                        button.textContent =
                            originalText;


                        return;

                    }


                    localStorage.removeItem(
                        'referredBy'
                    );


                    /*
                     * Avec le téléphone, Supabase
                     * peut demander la confirmation
                     * du code SMS.
                     */

                    if (
                        registerMethod === 'phone'
                    ) {

                        showToast(
                            'Compte créé. Un code SMS peut vous être demandé pour confirmer votre numéro.',
                            'success'
                        );

                    }

                    else {

                        showToast(
                            'Compte créé ! Vérifiez votre email si une confirmation est demandée.',
                            'success'
                        );

                    }


                    button.disabled =
                        false;


                    button.textContent =
                        originalText;


                    /*
                     * Retour vers Connexion
                     */

                    document.getElementById(
                        'tab-login'
                    ).click();

                }

                catch (
                    error
                ) {

                    showToast(
                        error.message ||
                        'Une erreur est survenue.',
                        'error'
                    );


                    button.disabled =
                        false;


                    button.textContent =
                        originalText;

                }

            }
        );



        /* =========================================================
           CODE DE PARRAINAGE
           ========================================================= */

        const ref =
            new URLSearchParams(
                window.location.search
            ).get('ref');


        if (ref) {

            localStorage.setItem(
                'referredBy',
                ref
            );

        }



        /* =========================================================
           OUVRIR INSCRIPTION SI ?tab=register
           ========================================================= */

        const params =
            new URLSearchParams(
                window.location.search
            );


        if (
            params.get('tab') ===
            'register'
        ) {

            document.getElementById(
                'tab-register'
            ).click();

        }

    </script>


</body>

</html>
